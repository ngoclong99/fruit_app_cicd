upstream backend_srv  { server backend:5000; }
upstream frontend_srv { server frontend:80; }

# HTTP — dùng tạm để test (chưa có SSL)
# Sau này thêm SSL thì đổi thành redirect 301 sang HTTPS
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # /api/* → Backend
    location /api/ {
        proxy_pass         http://backend_srv/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # /* → Frontend
    location / {
        proxy_pass         http://frontend_srv;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

