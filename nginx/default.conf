# Dinh nghia upstream (nhom server phia sau Nginx)
# Nginx se forward request den cac upstream nay
upstream backend_srv  { server backend:5000; }   # Backend Node.js chay o port 5000
upstream frontend_srv { server frontend:80; }    # Frontend React chay o port 80

# ─── Server HTTP (port 80) ────────────────────────────────────────────────
# Chi nhan request HTTP roi chuyen huong sang HTTPS
# Khong phuc vu noi dung truc tiep o HTTP
server {
    listen 80;
    server_name vhnlong.store www.vhnlong.store;

    # Chuyen toan bo HTTP request sang HTTPS (301 = redirect vinh vien)
    location / { return 301 https://$host$request_uri; }
}

# ─── Server HTTPS (port 443) ──────────────────────────────────────────────
# Phuc vu toan bo noi dung qua HTTPS voi SSL/TLS
server {
    listen 443 ssl http2;   # http2: tang hieu suat, giam latency
    server_name vhnlong.store www.vhnlong.store;

    # Duong dan den SSL certificate do Let's Encrypt cap
    # Certificate nay duoc tao boi Certbot khi chay morning.ps1
    ssl_certificate     /etc/letsencrypt/live/vhnlong.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vhnlong.store/privkey.pem;

    # Chi cho phep TLS 1.2 va 1.3 (phien ban cu TLS 1.0/1.1 da bi lo hong bao mat)
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Bo cipher manh, loai bo cipher yeu (aNULL = khong xac thuc, MD5 = da bi pha vo)
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cho phep upload file toi da 50MB (upload avatar, tai lieu,...)
    client_max_body_size 50M;

    # ─── /api/* → Backend ─────────────────────────────────────────────────
    # Moi request bat dau bang /api/ se duoc forward den Backend Node.js
    location /api/ {
        proxy_pass         http://backend_srv/;   # Forward den backend, bo prefix /api
        proxy_http_version 1.1;                   # Can thiet cho keep-alive connection

        # Truyen thong tin request goc den backend
        # Backend doc nhung header nay de biet IP that cua client
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cho toi da 90 giay de backend xu ly request (upload file lon, query phuc tap)
        proxy_read_timeout 90s;
    }

    # ─── /* → Frontend ────────────────────────────────────────────────────
    # Moi request con lai se duoc forward den Frontend React
    location / {
        proxy_pass         http://frontend_srv;
        proxy_http_version 1.1;

        # Truyen thong tin request goc den frontend
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
