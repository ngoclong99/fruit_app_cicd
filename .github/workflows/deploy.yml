name: Build & Deploy

on:
  push:
    # develop chi chay local, khong deploy EC2 nen khong trigger workflow
    branches: [staging, main]

env:
  AWS_REGION: ap-southeast-1

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build Docker images và push lên ECR
  # ─────────────────────────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag:   ${{ steps.tag.outputs.tag }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment from branch
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "environment=production"  >> $GITHUB_OUTPUT ;;
            staging) echo "environment=staging"     >> $GITHUB_OUTPUT ;;
            *)       echo "environment=development" >> $GITHUB_OUTPUT ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (branch + git short SHA)
        id: tag
        run: echo "tag=${{ github.ref_name }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Lấy VITE_API_URL từ Parameter Store thay vì GitHub Secrets
      - name: Fetch VITE_API_URL from Parameter Store
        run: |
          VITE_API_URL=$(aws ssm get-parameter \
            --name "/myapp/${{ steps.env.outputs.environment }}/VITE_API_URL" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          echo "VITE_API_URL=$VITE_API_URL" >> $GITHUB_ENV

      - name: Build & push backend
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build \
            -t $ECR_REGISTRY/myapp-backend:${{ steps.tag.outputs.tag }} \
            ./backend
          docker push $ECR_REGISTRY/myapp-backend:${{ steps.tag.outputs.tag }}
          docker tag  $ECR_REGISTRY/myapp-backend:${{ steps.tag.outputs.tag }} \
                      $ECR_REGISTRY/myapp-backend:${{ github.ref_name }}-latest
          docker push $ECR_REGISTRY/myapp-backend:${{ github.ref_name }}-latest

      - name: Build & push frontend
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build \
            --build-arg VITE_API_URL=$VITE_API_URL \
            -t $ECR_REGISTRY/myapp-frontend:${{ steps.tag.outputs.tag }} \
            ./frontend
          docker push $ECR_REGISTRY/myapp-frontend:${{ steps.tag.outputs.tag }}
          docker tag  $ECR_REGISTRY/myapp-frontend:${{ steps.tag.outputs.tag }} \
                      $ECR_REGISTRY/myapp-frontend:${{ github.ref_name }}-latest
          docker push $ECR_REGISTRY/myapp-frontend:${{ github.ref_name }}-latest

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy lên EC2 (environment-specific)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ needs.build.outputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ needs.build.outputs.environment }}
      url:  ${{ vars.APP_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # Fetch tất cả app secrets từ Parameter Store → tạo backend/.env
      # Keys can co trong SSM: DB_NAME, DB_USER, DB_PASSWORD, VITE_API_URL,
      #   NGINX_HTTP_PORT, PGADMIN_PORT, PGADMIN_EMAIL, PGADMIN_PASSWORD
      - name: Fetch secrets from Parameter Store
        run: |
          mkdir -p backend
          aws ssm get-parameters-by-path \
            --path "/myapp/${{ needs.build.outputs.environment }}/" \
            --with-decryption \
            --query "Parameters[*].[Name,Value]" \
            --output text | \
          awk -F'\t' '{n=split($1,a,"/"); print a[n]"="$2}' > backend/.env
          echo "PORT=5000"                                           >> backend/.env
          echo "ENVIRONMENT=${{ needs.build.outputs.environment }}" >> backend/.env

      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "docker-compose.prod.yml,nginx/default.conf,backend/.env"
          # 1 EC2: deploy vao thu muc rieng cho tung moi truong
          #   ~/app/production/ va ~/app/staging/
          # Neu dung 3 EC2 rieng: doi thanh "target: ~/app" (bo thu muc con)
          target:   ~/app/${{ needs.build.outputs.environment }}
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG:    ${{ needs.build.outputs.image_tag }}
          ENVIRONMENT:  ${{ needs.build.outputs.environment }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_REGISTRY,IMAGE_TAG,ENVIRONMENT
          script: |
            set -e
            cd ~/app/${ENVIRONMENT}

            # Login ECR
            aws ecr get-login-password --region ap-southeast-1 | \
              docker login --username AWS --password-stdin ${ECR_REGISTRY}

            # Load bien tu backend/.env vao shell environment
            # Docker Compose doc ${NGINX_HTTP_PORT}, ${DB_NAME},... tu shell — phai load truoc
            set -a && source backend/.env && set +a

            # Dung project name "-p myapp-${ENVIRONMENT}" de namespace rieng tung moi truong
            # Container: myapp-production-backend-1, myapp-staging-backend-1
            # Volume:    myapp-production_postgres_data, myapp-staging_postgres_data
            # Neu dung 3 EC2 rieng: bo flag "-p myapp-${ENVIRONMENT}" vi moi EC2 chi co 1 moi truong
            ECR_REGISTRY=${ECR_REGISTRY} IMAGE_TAG=${IMAGE_TAG} ENVIRONMENT=${ENVIRONMENT} \
              docker compose -p myapp-${ENVIRONMENT} -f docker-compose.prod.yml pull

            # Dung containers cu truoc khi deploy moi -- giai phong port
            # "--remove-orphans": xoa container cu khong con trong compose file
            # "|| true": khong bao loi neu chua co container nao (lan deploy dau tien)
            # Volume (postgres_data) KHONG bi xoa -- data van con
            ECR_REGISTRY=${ECR_REGISTRY} IMAGE_TAG=${IMAGE_TAG} ENVIRONMENT=${ENVIRONMENT} \
              docker compose -p myapp-${ENVIRONMENT} -f docker-compose.prod.yml down --remove-orphans || true

            ECR_REGISTRY=${ECR_REGISTRY} IMAGE_TAG=${IMAGE_TAG} ENVIRONMENT=${ENVIRONMENT} \
              docker compose -p myapp-${ENVIRONMENT} -f docker-compose.prod.yml up -d

            # Dọn images cũ — tiết kiệm disk
            docker image prune -f

            echo "Deployed ${IMAGE_TAG} to ${ENVIRONMENT}"
