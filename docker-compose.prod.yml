services:

  # ─── Node.js Backend ──────────────────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/myapp-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./backend/.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      NODE_ENV: ${ENVIRONMENT}
    networks: [app-net]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── React Frontend ───────────────────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/myapp-frontend:${IMAGE_TAG:-latest}
    restart: always
    networks: [app-net]

  # ─── Nginx ────────────────────────────────────────────────────────────────
  # 1 EC2 nhieu moi truong: moi truong dung port khac nhau
  #   production  -> NGINX_HTTP_PORT=80
  #   staging     -> NGINX_HTTP_PORT=8080
  #
  # Neu doi sang 3 EC2 rieng:
  #   - Xoa bien NGINX_HTTP_PORT, doi lai thanh "80:80" co dinh
  #   - Xoa NGINX_HTTP_PORT khoi SSM va deploy.yml
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [app-net]

  # ─── pgAdmin (Giao dien quan ly PostgreSQL qua trinh duyet) ───────────────
  # 1 EC2 nhieu moi truong: moi truong dung port khac nhau
  #   production  -> PGADMIN_PORT=5050 -> http://[EC2-IP]:5050
  #   staging     -> PGADMIN_PORT=5051 -> http://[EC2-IP]:5051
  #
  # Neu doi sang 3 EC2 rieng:
  #   - Xoa bien PGADMIN_PORT, doi lai thanh "5050:80" co dinh
  #   - Xoa PGADMIN_PORT khoi SSM va deploy.yml
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    networks: [app-net]

networks:
  app-net:
    driver: bridge
