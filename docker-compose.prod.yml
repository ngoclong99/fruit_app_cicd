services:

  # ─── PostgreSQL (Docker) ───────────────────────────────────────────────────
  # CHE DO HIEN TAI: Docker PostgreSQL + EBS volume (tiet kiem chi phi)
  #
  # CHUYEN SANG RDS: chi can 3 buoc:
  #   1. Xoa service "db" nay va volumes "postgres_data" o cuoi file
  #   2. Xoa "depends_on: db" trong backend va pgadmin
  #   3. Cap nhat SSM: DB_HOST=<rds-endpoint>, DB_USER, DB_PASSWORD cho khop RDS
  #   (backend/src/db.ts tu dong bat SSL khi DB_HOST chua "rds.amazonaws.com")
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js Backend ──────────────────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/myapp-backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./backend/.env
    environment:
      # Docker mode: DB_HOST = ten service "db"
      # RDS mode:    DB_HOST = <rds-endpoint> (cap nhat trong SSM)
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      NODE_ENV: ${ENVIRONMENT}
    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── React Frontend ───────────────────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/myapp-frontend:${IMAGE_TAG:-latest}
    restart: always
    networks: [app-net]

  # ─── Nginx ────────────────────────────────────────────────────────────────
  # 1 EC2 nhieu moi truong: moi truong dung port khac nhau
  #   production  -> NGINX_HTTP_PORT=80
  #   staging     -> NGINX_HTTP_PORT=8080
  #
  # Neu doi sang 3 EC2 rieng:
  #   - Xoa bien NGINX_HTTP_PORT, doi lai thanh "80:80" co dinh
  #   - Xoa NGINX_HTTP_PORT khoi SSM va deploy.yml
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [app-net]

  # ─── pgAdmin (Giao dien quan ly PostgreSQL qua trinh duyet) ───────────────
  # 1 EC2 nhieu moi truong: moi truong dung port khac nhau
  #   production  -> PGADMIN_PORT=5050 -> http://[EC2-IP]:5050
  #   staging     -> PGADMIN_PORT=5051 -> http://[EC2-IP]:5051
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
