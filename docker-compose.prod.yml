services:

  # ─── PostgreSQL ───────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: myapp-db
    restart: always
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # KHÔNG expose port ra ngoài trong production!
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js Backend ──────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/myapp-backend:${IMAGE_TAG:-latest}
    container_name: myapp-backend
    restart: always
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks: [app-net]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── React Frontend ───────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/myapp-frontend:${IMAGE_TAG:-latest}
    container_name: myapp-frontend
    restart: always
    networks: [app-net]

  # ─── Nginx (nhận request từ internet) ─────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: myapp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Bổ sung sau khi có SSL:
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on: [frontend, backend]
    networks: [app-net]

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge